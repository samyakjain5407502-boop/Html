<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cart_title">Your Cart - Jainzee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Mukta:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- LEFT ZONE: Profile Icon + Hamburger (mobile only) -->
            <div class="nav-left">
                <a href="/customer" class="nav-icon-btn" id="customerLoginBtn" title="Customer Login">
                    <i class="fas fa-user"></i>
                </a>
                <button class="hamburger" id="hamburger" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
            
            <!-- CENTER ZONE: Brand Logo & Title + Nav Links (desktop) -->
            <div class="nav-center">
                <div class="nav-logo">
                    <img id="navLogo" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Jainzee Logo" class="nav-logo-img">
                    <span id="navShopName" class="nav-shop-name">Jainzee Food Processing Industries</span>
                </div>
                <div class="nav-links" id="navLinks">
                    <a href="/" data-i18n="nav_home">Home</a>
                    <a href="/#products" data-i18n="nav_products">Products</a>
                    <a href="/#about" data-i18n="nav_about">About Us</a>
                    <a href="/#contact" data-i18n="nav_contact">Contact</a>
                </div>
            </div>
            
            <!-- RIGHT ZONE: My Orders + Cart -->
            <div class="nav-right">
                <div class="lang-toggle" id="langToggle">
                    <button class="lang-btn active" data-lang="en">🇬🇧 English</button>
                    <button class="lang-btn" data-lang="hi">🇮🇳 हिन्दी</button>
                </div>
                <a href="/cart" class="nav-icon-btn cart-icon-btn" id="cartLink" title="Cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="nav-btn-label">Cart</span>
                    <span class="cart-count-badge" id="cartBadge" style="display: none;">0</span>
                </a>
            </div>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <a href="/" data-i18n="nav_home">Home</a>
            <a href="/#products" data-i18n="nav_products">Products</a>
            <a href="/#about" data-i18n="nav_about">About Us</a>
            <a href="/#contact" data-i18n="nav_contact">Contact</a>
        </div>
    </nav>

    <!-- ===== CART SECTION ===== -->
    <section class="cart-section">
        <div class="container">
            <div class="section-header">
                <h2 data-i18n="cart_title">Your Shopping Cart</h2>
                <p data-i18n="cart_subtitle">Review your items and proceed to checkout</p>
            </div>

            <div id="cartContent">
                <!-- Cart items will be loaded here -->
                <div style="text-align: center; padding: 60px; color: var(--text-light);">
                    <i class="fas fa-shopping-cart" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.3;"></i>
                    <p style="font-size: 1.2rem;" data-i18n="cart_empty">Your cart is empty</p>
                </div>
            </div>

            <div id="cartSummary" style="display: none;">
                <div class="cart-summary-card">
                    <h3 style="color: var(--text); font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 25px; text-align: center;">
                        <i class="fas fa-receipt"></i> <span data-i18n="order_summary">Order Summary</span>
                    </h3>

                    <div class="summary-row">
                        <span data-i18n="subtotal">Subtotal</span>
                        <span id="cartSubtotal">₹0</span>
                    </div>

                    <div class="summary-row">
                        <span data-i18n="discount">Discount</span>
                        <span id="cartDiscount" style="color: #155724;">-₹0</span>
                    </div>

                    <div class="summary-row">
                        <span data-i18n="you_save">You Save</span>
                        <span id="cartYouSave" style="color: #721c24;">₹0</span>
                    </div>

                    <div class="summary-row" style="border-top: 2px solid rgba(184,134,11,0.3); margin-top: 10px; padding-top: 20px;">
                        <span style="font-weight: 700; font-size: 1.3rem; color: var(--primary);" data-i18n="total">Total</span>
                        <span id="cartTotal" style="font-weight: 800; font-size: 1.5rem; color: var(--primary);"></span>
                    </div>

                    <button class="btn btn-primary" style="width: 100%; margin-top: 25px; font-size: 1.1rem; padding: 18px;" onclick="proceedToCheckout()">
                        <i class="fas fa-credit-card"></i> <span data-i18n="proceed_checkout">Proceed to Checkout</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Cart page specific JS
        let cartItems = [];
        let currentLangCart = localStorage.getItem('jainzee_lang') || 'en';

        const cartTranslations = {
            en: {
                'cart_title': 'Your Cart',
                'cart_subtitle': 'Review your items and proceed to checkout',
                'cart_empty': 'Your cart is empty',
                'order_summary': 'Order Summary',
                'subtotal': 'Subtotal',
                'discount': 'Discount',
                'you_save': 'You Save',
                'total': 'Total',
                'proceed_checkout': 'Proceed to Checkout',
                'qty': 'Qty',
                'remove': 'Remove',
                'update': 'Update',
                'add_slot': 'Add Another Item',
                'checkout_title': 'Checkout',
                'checkout_address': 'Delivery Address',
                'checkout_phone': 'Phone Number',
                'checkout_name': 'Full Name',
                'checkout_payment': 'Payment Method',
                'checkout_upi': 'Pay via UPI',
                'checkout_cod': 'Cash on Delivery (COD)',
                'checkout_place_order': 'Place Order',
                'checkout_total': 'Total Amount',
                'checkout_name_placeholder': 'Enter your full name',
                'checkout_phone_placeholder': 'Enter your phone number',
                'checkout_address_placeholder': 'Enter your full address',
                'order_success': 'Order Placed Successfully!',
                'order_success_msg': 'Your order has been placed. Order ID:',
                'back_to_shop': 'Back to Shop'
            },
            hi: {
                'cart_title': 'आपका कार्ट',
                'cart_subtitle': 'अपने आइटम देखें और चेकआउट करें',
                'cart_empty': 'आपका कार्ट खाली है',
                'order_summary': 'ऑर्डर सारांश',
                'subtotal': 'जिओम',
                'discount': 'छूट',
                'you_save': 'आपको बचत मिलेगी',
                'total': 'कुल',
                'proceed_checkout': 'चेकआउट करें',
                'qty': 'मात्रा',
                'remove': 'हटाएं',
                'update': 'अपडेट',
                'add_slot': 'एक और आइटम जोड़ें',
                'checkout_title': 'चेकआउट',
                'checkout_address': 'डिलीवरी पता',
                'checkout_phone': 'फ़ोन नंबर',
                'checkout_name': 'पूरा नाम',
                'checkout_payment': 'भुगतान का तरीका',
                'checkout_upi': 'UPI के माध्यम से भुगतान करें',
                'checkout_cod': 'नगद डिलीवरी (COD)',
                'checkout_place_order': 'ऑर्डर दें',
                'checkout_total': 'कुल राशि',
                'checkout_name_placeholder': 'अपना पूरा नाम दर्ज करें',
                'checkout_phone_placeholder': 'अपना फ़ोन नंबर दर्ज करें',
                'checkout_address_placeholder': 'अपना पूरा पता दर्ज करें',
                'order_success': 'ऑर्डर सफलतापूर्वक दिया गया!',
                'order_success_msg': 'आपका ऑर्डर दिया गया है। ऑर्डर आईडी:',
                'back_to_shop': 'शॉप पर वापस जाएं'
            }
        };

        function t(key) {
            return cartTranslations[currentLangCart][key] || key;
        }

        function applyCartTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (cartTranslations[currentLangCart] && cartTranslations[currentLangCart][key]) {
                    el.textContent = cartTranslations[currentLangCart][key];
                }
            });
        }

        function formatPriceCart(price) {
            if (!price) return '₹0';
            const clean = String(price).replace(/[₹,\s]/g, '');
            const num = parseFloat(clean);
            if (isNaN(num)) return price;
            return '₹' + num.toLocaleString('en-IN');
        }

        async function loadCart() {
            try {
                await loadGlobalDiscount();
                const res = await fetch('/api/cart');
                cartItems = await res.json();
                renderCart();
                updateCartCount();
            } catch(e) {
                console.error('Failed to load cart:', e);
            }
        }

        let globalDiscountPercent = 0;

        async function loadGlobalDiscount() {
            try {
                const res = await fetch('/api/site');
                const data = await res.json();
                // Use global_discount_percent (fallback to legacy global_discount)
                globalDiscountPercent = parseFloat(String(data.global_discount_percent || data.global_discount || '0').replace('%', '')) || 0;
            } catch(e) {
                console.error('Failed to load discount:', e);
                globalDiscountPercent = 0;
            }
        }

        function renderCart() {
            const content = document.getElementById('cartContent');
            const summary = document.getElementById('cartSummary');

            if (!cartItems.length) {
                content.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-light);"><i class="fas fa-shopping-cart" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.3;"></i><p style="font-size: 1.2rem;">' + t('cart_empty') + '</p></div>';
                summary.style.display = 'none';
                return;
            }

            let html = '';
            let subtotal = 0;
            let globalDiscountAmount = 0;

            cartItems.forEach((item, index) => {
                const basePrice = parseFloat(String(item.base_price || '0').replace(/[₹,\s]/g, '')) || 0;
                const gradePrice = parseFloat(String(item.grade_price || '0').replace(/[₹,\s]/g, '')) || 0;
                const itemOldPrice = parseFloat(String(item.old_price || '0').replace(/[₹,\s]/g, '')) || 0;
                
                // Use grade_price if available, otherwise base_price
                // NOTE: item price is ALREADY the final discounted price - do NOT apply MRP savings again
                const itemPrice = gradePrice > 0 ? gradePrice : basePrice;
                
                // Calculate global admin discount on this item only
                const itemSubtotal = itemPrice * item.quantity;
                const itemGlobalDiscount = (itemSubtotal * globalDiscountPercent) / 100;
                
                subtotal += itemSubtotal;
                globalDiscountAmount += itemGlobalDiscount;

                const name = currentLangCart === 'hi' ? (item.name_hi || item.name_en) : item.name_en;
                const image = item.image ? '<img src="' + item.image + '" alt="' + name + '" style="width:80px;height:80px;object-fit:cover;border-radius:10px;">' : '<div style="width:80px;height:80px;background:var(--card-bg);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;">📦</div>';

                html += `
                    <div class="cart-item" style="display: flex; align-items: center; gap: 20px; padding: 25px; background: var(--card-bg); border-radius: var(--radius); margin-bottom: 20px; border: 1px solid rgba(255,215,0,0.15); box-shadow: var(--shadow);">
                        ${image}
                        <div style="flex: 1;">
                            <h3 style="color: var(--text); font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 5px;">${name}</h3>
                            <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 10px;">${t('qty')}: ${item.grade_name || item.weight || ''}</p>
                    <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                        <span style="color: var(--primary-dark); font-weight: 700; font-size: 1.2rem;">${formatPriceCart(item.grade_price || item.base_price)}</span>
                        ${itemOldPrice > 0 ? '<span style="color: #999; text-decoration: line-through; font-size: 0.9rem;">' + formatPriceCart(item.old_price) + '</span>' : ''}
                    </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="number" min="1" max="${item.stock}" value="${item.quantity}" onchange="updateCartQty(${index}, this.value)" style="width: 70px; padding: 8px; text-align: center; border: 2px solid #e8e0d5; border-radius: 8px; background: white; color: var(--text);">
                            <button onclick="removeFromCart(${index})" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            content.innerHTML = html;
            summary.style.display = '';

            // Update summary - only apply admin-set global discount
            // Item price is ALREADY the final discounted price
            const total = subtotal - globalDiscountAmount;
            document.getElementById('cartSubtotal').textContent = formatPriceCart('₹' + subtotal.toFixed(2));
            document.getElementById('cartDiscount').textContent = '-' + formatPriceCart('₹' + globalDiscountAmount.toFixed(2));
            document.getElementById('cartYouSave').textContent = formatPriceCart('₹' + globalDiscountAmount.toFixed(2));
            document.getElementById('cartTotal').textContent = formatPriceCart('₹' + total.toFixed(2));
        }

        async function updateCartQty(index, qty) {
            const quantity = parseInt(qty) || 1;
            try {
                await fetch('/api/cart/' + index, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: quantity })
                });
                loadCart();
            } catch(e) {
                console.error('Failed to update cart:', e);
            }
        }

        async function removeFromCart(index) {
            try {
                await fetch('/api/cart/' + index, { method: 'DELETE' });
                loadCart();
            } catch(e) {
                console.error('Failed to remove item:', e);
            }
        }

        async function updateCartCount() {
            try {
                const res = await fetch('/api/cart/count');
                const data = await res.json();
                const cartLink = document.getElementById('cartLink');
                if (cartLink) {
                    let badge = cartLink.querySelector('.cart-count-badge');
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'cart-count-badge';
                        cartLink.appendChild(badge);
                    }
                    badge.textContent = data.count;
                    badge.style.display = data.count > 0 ? '' : 'none';
                }
            } catch(e) {}
        }

        function proceedToCheckout() {
            window.location.href = '/checkout';
        }

        // Language toggle
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLangCart = btn.dataset.lang;
                localStorage.setItem('jainzee_lang', currentLangCart);
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLangCart));
                applyCartTranslations();
                renderCart();
            });
        });

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            applyCartTranslations();
            loadCart();
            document.getElementById('currentYear').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
