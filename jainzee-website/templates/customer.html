<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Panel - Jainzee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .customer-header { background: linear-gradient(135deg, #2c1810, #5a3d2b); }
        .customer-header .brand i { color: #ffd700; }
        .customer-content { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .auth-section { max-width: 450px; margin: 40px auto; }
        .auth-card { background: white; border-radius: 16px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .auth-card h2 { color: #2c1810; margin-bottom: 20px; text-align: center; }
        .auth-tabs { display: flex; margin-bottom: 25px; background: #f5f0e8; border-radius: 10px; padding: 4px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; color: #8a7362; }
        .auth-tab.active { background: #b8860b; color: white; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #2c1810; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; border: 2px solid #e8e0d5; border-radius: 10px; font-size: 0.95rem; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #b8860b; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 25px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.3s; font-family: inherit; text-decoration: none; }
        .btn-primary { background: #b8860b; color: white; }
        .btn-primary:hover { background: #8b6508; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-outline { background: transparent; border: 2px solid #ddd; color: #4a3728; }
        .btn-outline:hover { border-color: #b8860b; }
        .btn-block { width: 100%; justify-content: center; }
        .customer-dashboard { display: none; }
        .customer-dashboard.active { display: block; }
        .welcome-bar { background: white; border-radius: 16px; padding: 25px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .welcome-bar h2 { color: #2c1810; }
        .welcome-bar p { color: #8a7362; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .order-card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .order-card h3 { color: #2c1810; margin-bottom: 10px; }
        .order-items { margin: 15px 0; }
        .order-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0ece5; font-size: 0.9rem; }
        .order-total { font-size: 1.2rem; font-weight: 700; color: #b8860b; margin-top: 10px; }
        .order-status { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-shipped { background: #cce5ff; color: #004085; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .empty-state { text-align: center; padding: 60px 20px; color: #8a7362; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #b8860b; }
        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 25px; border-radius: 10px; color: white; font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #8a7362; text-decoration: none; font-size: 0.85rem; margin-top: 15px; }
        .back-link:hover { color: #b8860b; }
    </style>
</head>
<body>
    <header class="admin-header customer-header">
        <div class="brand">
            <i class="fas fa-user-circle"></i>
            <span>Jainzee Customer Panel</span>
        </div>
        <nav class="admin-nav">
            <a href="/"><i class="fas fa-home"></i> Home</a>
            <a href="/#products"><i class="fas fa-box-open"></i> Products</a>
            <a href="/admin"><i class="fas fa-lock"></i> Admin</a>
        </nav>
    </header>

    <main class="customer-content">
        <!-- ===== LOGIN / REGISTER ===== -->
        <div class="auth-section" id="authSection">
            <div class="auth-card">
                <h2><i class="fas fa-user-circle"></i> Customer Login</h2>
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                    <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <div class="auth-form active" id="loginForm">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="loginPhone" placeholder="e.g. 9826000000">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password">
                    </div>
                    <button class="btn btn-primary btn-block" onclick="customerLogin()">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                    
                    <!-- Divider -->
                    <div style="text-align: center; margin: 20px 0; position: relative;">
                        <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e8e0d5;"></div>
                        <span style="background: white; padding: 0 15px; position: relative; color: #8a7362; font-size: 0.85rem;">OR</span>
                    </div>
                    
                    <!-- Google Sign In Button -->
                    <button class="btn btn-google btn-block" onclick="googleSignIn()" style="background: white; color: #757575; border: 2px solid #e8e0d5; box-shadow: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" style="margin-right: 8px;">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.03 2.53-2.16 3.31v2.77h3.49c2.04-1.88 3.24-4.64 3.24-7.89z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.49-2.77c-.98.66-2.23 1.06-3.79 1.06-2.91 0-5.37-1.96-6.25-4.63H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.75 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.72-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.64 0 3.11.56 4.27 1.67l3.2-3.2C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.57 2.84c.88-2.67 3.34-4.53 6.25-4.53z"/>
                        </svg>
                        Sign in with Google
                    </button>
                </div>

                <!-- Register Form (simplified: only 3 mandatory fields) -->
                <div class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label>Email or Phone Number</label>
                        <input type="text" id="regPhone" placeholder="you@email.com or 9826000000">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Create password (min 4 chars)">
                    </div>
                    <p style="font-size: 0.8rem; color: #8a7362; margin-bottom: 15px;">
                        <i class="fas fa-info-circle"></i> Address is collected at checkout.
                    </p>
                    <button class="btn btn-success btn-block" onclick="customerRegister()">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                </div>
            </div>
            <div style="text-align: center;">
                <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
            </div>
        </div>

        <!-- ===== CUSTOMER DASHBOARD ===== -->
        <div class="customer-dashboard" id="customerDashboard">
            <div class="welcome-bar">
                <div>
                    <h2>Welcome, <span id="customerName"></span>! 👋</h2>
                    <p>View your order history and track your orders</p>
                </div>
                <button class="btn btn-outline" onclick="customerLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <h2 style="color: #2c1810; margin-bottom: 20px;"><i class="fas fa-shopping-bag"></i> My Orders</h2>
            <div class="orders-grid" id="ordersGrid">
                <div class="empty-state">
                    <i class="fas fa-shopping-bag"></i>
                    <h3>No orders yet</h3>
                    <p>Browse our products and place your first order!</p>
                    <a href="/#products" class="btn btn-primary" style="margin-top: 15px;">
                        <i class="fas fa-box-open"></i> Browse Products
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== TOAST ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== AUTH TABS ====================
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // ==================== AUTH ====================
        async function customerRegister() {
            const identifier = document.getElementById('regPhone').value.trim();
            // Determine if the identifier is an email or phone
            const isEmail = identifier.includes('@');
            const data = {
                name: document.getElementById('regName').value.trim(),
                phone: isEmail ? '' : identifier,
                email: isEmail ? identifier : '',
                password: document.getElementById('regPassword').value
            };
            if (!data.name || !identifier || !data.password) {
                showToast('Name, email/phone and password are required!', 'error');
                return;
            }
            try {
                const res = await fetch('/api/customer/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Registration failed');
                showToast('Registration successful! Welcome ' + result.name + '!');
                loadCustomerDashboard();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function customerLogin() {
            const data = {
                phone: document.getElementById('loginPhone').value.trim(),
                password: document.getElementById('loginPassword').value
            };
            if (!data.phone || !data.password) {
                showToast('Phone and password are required!', 'error');
                return;
            }
            try {
                const res = await fetch('/api/customer/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Login failed');
                showToast('Welcome back, ' + result.name + '!');
                loadCustomerDashboard();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function customerLogout() {
            await fetch('/api/customer/logout', { method: 'POST' });
            showToast('Logged out successfully');
            location.reload();
        }

        // ==================== GOOGLE AUTH ====================
        
        async function googleSignIn() {
            // Open Google OAuth popup
            const width = 500, height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            
            const popup = window.open(
                '/api/auth/google',
                'Google Sign In',
                `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
            );
            
            // Listen for messages from popup
            window.addEventListener('message', async function handler(event) {
                if (event.origin !== window.location.origin) return;
                
                if (event.data.type === 'google-auth-success') {
                    window.removeEventListener('message', handler);
                    
                    // Fetch customer data
                    await loadCustomerDashboard();
                    showToast('Welcome, ' + event.data.name + '!');
                    
                    if (popup) popup.close();
                } else if (event.data.type === 'google-auth-error') {
                    window.removeEventListener('message', handler);
                    showToast(event.data.error || 'Google sign in failed', 'error');
                    if (popup) popup.close();
                }
            });
        }

        // ==================== DASHBOARD ====================
        async function loadCustomerDashboard() {
            try {
                const res = await fetch('/api/customer/me');
                const data = await res.json();
                if (data.logged_in) {
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('customerDashboard').classList.add('active');
                    document.getElementById('customerName').textContent = data.customer.name;
                    loadOrders();
                }
            } catch (e) {
                console.error('Failed to load dashboard:', e);
            }
        }

        async function loadOrders() {
            try {
                const res = await fetch('/api/customer/orders');
                const orders = await res.json();
                const grid = document.getElementById('ordersGrid');
                if (!orders.length) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-shopping-bag"></i>
                            <h3>No orders yet</h3>
                            <p>Browse our products and place your first order!</p>
                            <a href="/#products" class="btn btn-primary" style="margin-top: 15px;">
                                <i class="fas fa-box-open"></i> Browse Products
                            </a>
                        </div>`;
                    return;
                }
                grid.innerHTML = '';
                orders.forEach(order => {
                    let items = [];
                    try { items = JSON.parse(order.items); } catch(e) {}
                    const statusClass = 'status-' + (order.status || 'pending');
                    const statusText = (order.status || 'pending').toUpperCase();
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <h3>Order #${order.id}</h3>
                        <span class="order-status ${statusClass}">${statusText}</span>
                        <div class="order-items">
                            ${items.map(item => `
                                <div class="order-item">
                                    <span>${item.name} (${item.grade || 'Standard'}) x${item.qty}</span>
                                    <span>${item.price}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="order-total">Total: ${order.total}</div>
                        <p style="font-size: 0.8rem; color: #8a7362; margin-top: 10px;">
                            <i class="fas fa-calendar"></i> ${order.created_at}
                        </p>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error('Failed to load orders:', e);
            }
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', () => {
            loadCustomerDashboard();
        });
    </script>
</body>
</html>
