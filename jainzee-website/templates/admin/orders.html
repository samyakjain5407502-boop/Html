<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Jainzee Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/premium.css') }}?v=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/static/js/premium.js?v=1.0"></script>
    <style>
        .order-status-select { padding: 8px 12px; border-radius: 8px; border: 2px solid #e8e0d5; font-family: inherit; font-size: 0.85rem; }
        .order-items-list { font-size: 0.85rem; }
        .order-items-list div { padding: 3px 0; }
        .order-customer { font-size: 0.9rem; }
        .order-customer strong { color: #2c1810; }
        /* Quick filter tabs */
        .order-tab-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .order-tab { padding: 8px 18px; border-radius: 20px; border: 2px solid #e8e0d5; background: white; color: #8a7362; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s; }
        .order-tab.active { background: #b8860b; border-color: #b8860b; color: white; }
        .order-tab:hover:not(.active) { border-color: #b8860b; color: #b8860b; }
    </style>
<script src="/static/js/csrf.js"></script>
</head>
<body>
    <header class="admin-header">
        <div class="brand">
            <i class="fas fa-seedling"></i>
            <span>Jainzee Admin Panel</span>
        </div>
        <nav class="admin-nav">
            <a href="{{ url_for('admin_dashboard') }}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="{{ url_for('admin_products_page') }}"><i class="fas fa-box-open"></i> Products & Stock</a>
            <a href="{{ url_for('admin_orders_page') }}" class="active"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="{{ url_for('admin_settings_page') }}"><i class="fas fa-cog"></i> Settings</a>
            <a href="/" target="_blank"><i class="fas fa-external-link-alt"></i> View Site</a>
            <a href="{{ url_for('admin_logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </header>

    <main class="admin-content">
        <h1 class="page-title"><i class="fas fa-shopping-cart"></i> Customer Orders</h1>

        <div class="admin-card">
            <div class="admin-card-header">
                <h2>All Orders</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div style="display: flex; gap: 5px; background: #f5f0e8; padding: 5px; border-radius: 8px;">
                        <button class="btn btn-sm" id="showActiveBtn" onclick="toggleOrderFilter('active')" style="background: var(--primary); color: white; padding: 8px 16px; font-size: 0.85rem;">
                            <i class="fas fa-eye"></i> Active
                        </button>
                        <button class="btn btn-sm" id="showArchivedBtn" onclick="toggleOrderFilter('archived')" style="background: transparent; color: var(--text); padding: 8px 16px; font-size: 0.85rem;">
                            <i class="fas fa-archive"></i> Archived
                        </button>
                    </div>
                    <button class="btn btn-outline" onclick="loadOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
            </div>
        <div class="order-tab-bar" id="orderTabBar">
            <button class="order-tab active" id="tab-all"       onclick="setOrderTab('all')"><i class="fas fa-list"></i> All Orders</button>
            <button class="order-tab"        id="tab-pending"   onclick="setOrderTab('pending')"><i class="fas fa-clock"></i> New / Pending</button>
            <button class="order-tab"        id="tab-confirmed" onclick="setOrderTab('confirmed')"><i class="fas fa-check"></i> Confirmed</button>
            <button class="order-tab"        id="tab-shipped"   onclick="setOrderTab('shipped')"><i class="fas fa-truck"></i> Shipped</button>
            <button class="order-tab"        id="tab-delivered" onclick="setOrderTab('delivered')"><i class="fas fa-box"></i> Delivered</button>
        </div>
            <div style="overflow-x: auto;">
                <table class="admin-table" id="ordersTable">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="9" style="text-align: center; padding: 40px; color: #8a7362;">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    <style>
        .new-order-flash {
            animation: newOrderFlash 3s ease;
            background: #fff8dc !important;
        }
        @keyframes newOrderFlash {
            0% { background: #ffeb3b; }
            100% { background: transparent; }
        }
    </style>
    <script>
        function showToast(message, type = 'success') {
            // Premium animated toast from premium.js when available
            if (window.JZ && JZ.toast) { JZ.toast(message, type); return; }
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        let currentFilter = 'active'; // 'active' or 'archived'
        let activeTabFilter = 'all'; // quick status filter

        function setOrderTab(tab) {
            activeTabFilter = tab;
            document.querySelectorAll('.order-tab').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById('tab-' + tab);
            if (btn) btn.classList.add('active');
            loadOrders();
        }

        
        async function loadOrders() {
            try {
                const url = currentFilter === 'archived' ? '/admin/api/orders?show_hidden=true' : '/admin/api/orders';
                const res = await fetch(url);
                const orders = await res.json();
                const tbody = document.getElementById('ordersTableBody');
                if (!orders.length) {
                    tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 40px; color: #8a7362;">No ${currentFilter} orders</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';

                // Apply quick-tab filter (client-side)
                const tabStatus = activeTabFilter;
                const filtered = tabStatus === 'all' ? orders : orders.filter(o => {
                    const st = String(o.status || '').toLowerCase();
                    if (tabStatus === 'pending')   return st.startsWith('pending') || st === 'pending';
                    if (tabStatus === 'confirmed') return st === 'confirmed';
                    if (tabStatus === 'shipped')   return st === 'shipped';
                    if (tabStatus === 'delivered') return st.includes('deliver');
                    return true;
                });
                if (!filtered.length) {
                    tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 40px; color: #8a7362;">No ${tabStatus === 'all' ? currentFilter : tabStatus} orders</td></tr>`;
                    return;
                }

                filtered.forEach(order => {
                    const tr = document.createElement('tr');
                    tr.setAttribute('data-order-id', order.id);
                    const isPending = String(order.status || '').startsWith('pending');
                    const isHidden = order.is_hidden === 1;
                    tr.style.cssText = isPending ? 'background: #fff8e1;' : (isHidden ? 'background: #f5f5f5; opacity: 0.8;' : '');
                    
                    // Use enriched items_parsed if available, otherwise fallback to raw items
                    let itemsHtml = '';
                    if (order.items_parsed && order.items_parsed.length > 0) {
                        itemsHtml = order.items_parsed.map(item => `
                            <div style="padding: 4px 0; border-bottom: 1px solid #f0e8d8;">
                                <strong style="color: #2c1810;">${item.name}</strong>
                                ${item.variant ? `<span style="color: #8a7362; font-size: 0.8rem;"> (${item.variant})</span>` : ''}
                                <br><span style="color: #8a7362; font-size: 0.85rem;">Qty: ${item.quantity} × ${item.unit_price} = <strong>${item.total}</strong></span>
                            </div>
                        `).join('');
                    } else {
                        // Fallback to raw items
                        let items = [];
                        try { items = JSON.parse(order.items || '[]'); } catch(e) {}
                        itemsHtml = items.map(item => `<div>• ${item.name || 'Item'} x${item.quantity || 1}</div>`).join('');
                    }
                    
                    // Actions column
                    const hideBtn = isHidden 
                        ? `<button class="btn btn-sm" onclick="toggleHideOrder(${order.id})" style="background: #28a745; color: white; padding: 6px 12px; font-size: 0.75rem; margin-right: 5px;" title="Restore Order">
                            <i class="fas fa-eye"></i> Restore
                           </button>`
                        : `<button class="btn btn-sm" onclick="toggleHideOrder(${order.id})" style="background: #ffc107; color: #000; padding: 6px 12px; font-size: 0.75rem; margin-right: 5px;" title="Hide/Archive Order">
                            <i class="fas fa-eye-slash"></i> Hide
                           </button>`;
                    
                    const deleteBtn = `<button class="btn btn-sm" onclick="deleteOrder(${order.id})" style="background: #dc3545; color: white; padding: 6px 12px; font-size: 0.75rem;" title="Delete Permanently">
                        <i class="fas fa-trash"></i> Delete
                    </button>`;

                    const invoiceBtn = `<button class="btn btn-sm btn-primary" onclick="window.open('/api/orders/${order.id}/invoice', '_blank')" title="Download Invoice" style="background: #b8860b; color: white; padding: 6px 12px; font-size: 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
                        <i class="fas fa-file-invoice-dollar"></i> Invoice
                    </button>`;

                    const parcelBtn = `<button class="btn btn-sm" onclick="printParcelSticker(${JSON.stringify(order).replace(/"/g, '&quot;')})" title="Print Parcel Sticker" style="background: #6c3483; color: white; padding: 6px 12px; font-size: 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
                        <i class="fas fa-shipping-fast"></i> Sticker
                    </button>`;
                    
                    tr.innerHTML = `
                        <td><strong>#${order.id}</strong>${isPending ? ' <span class="order-status-select" style="background:#ffc107; color:#000; font-size:0.7rem; border-radius:20px; padding:2px 8px; font-weight: bold;">NEW</span>' : ''}${isHidden ? ' <span style="background:#6c757d; color:white; font-size:0.7rem; border-radius:20px; padding:2px 8px;">ARCHIVED</span>' : ''}</td>
                        <td class="order-customer"><strong>${order.customer_name || '-'}</strong></td>
                        <td>${order.customer_phone || '-'}</td>
                        <td style="max-width: 200px; font-size: 0.85rem;">${order.customer_address || '-'}</td>
                        <td class="order-items-list" style="min-width: 250px;">
                            ${itemsHtml || '<span style="color: #8a7362;">No items</span>'}
                        </td>
                        <td><strong style="color: #b8860b; font-size: 1rem;">${order.total}</strong></td>
                        <td style="font-size: 0.8rem; white-space: nowrap;">
                            <i class="far fa-clock"></i> ${order.formatted_date || order.created_at}
                        </td>
                        <td>
                            <select class="order-status-select" onchange="updateOrderStatus(${order.id}, this.value)">
                                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                                <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                        </td>
                        <td>
                            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                                ${invoiceBtn}
                                ${parcelBtn}
                                ${hideBtn}
                                ${deleteBtn}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                showToast('Failed to load orders', 'error');
            }
        }
        
        async function toggleHideOrder(orderId) {
            if (!confirm('Are you sure you want to hide/archive this order?')) return;
            try {
                const res = await fetch(`/admin/api/orders/${orderId}/hide`, { method: 'POST' });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Failed to hide order');
                showToast(result.message);
                loadOrders();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function deleteOrder(orderId) {
            if (!confirm('Are you sure you want to PERMANENTLY DELETE this order? This action cannot be undone!')) return;
            try {
                const res = await fetch(`/admin/api/orders/${orderId}`, { method: 'DELETE' });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Failed to delete order');
                showToast('Order deleted permanently');
                loadOrders();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        function toggleOrderFilter(filter) {
            currentFilter = filter;
            const activeBtn = document.getElementById('showActiveBtn');
            const archivedBtn = document.getElementById('showArchivedBtn');
            
            if (filter === 'active') {
                activeBtn.style.background = 'var(--primary)';
                activeBtn.style.color = 'white';
                archivedBtn.style.background = 'transparent';
                archivedBtn.style.color = 'var(--text)';
            } else {
                archivedBtn.style.background = 'var(--primary)';
                archivedBtn.style.color = 'white';
                activeBtn.style.background = 'transparent';
                activeBtn.style.color = 'var(--text)';
            }
            
            loadOrders();
        }

        async function updateOrderStatus(orderId, status) {
            try {
                const res = await fetch(`/admin/api/orders/${orderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Failed to update');
                showToast('Order status updated to ' + status);
            } catch (e) {
                showToast(e.message, 'error');
            }
        }


        // ===== PARCEL SHIPPING STICKER =====
        function printParcelSticker(order) {
            const shopName = 'JAINZEE FOOD PROCESSING INDUSTRIES';
            const shopAddr = 'Siyaganj, Indore, Madhya Pradesh - 452001';
            const shopPhone = '+91 98260 00000';
            const payMethod = String(order.status || '').toLowerCase().includes('upi') ? 'PREPAID (UPI)' : 'COD';
            const isCOD = payMethod === 'COD (CASH ON DELIVERY)';
            const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parcel Sticker - Order #${order.id}</title>
<style>
  @media print { body { margin: 0; } }
  body { font-family: Arial, sans-serif; width: 4in; min-height: 6in; padding: 0.3in; box-sizing: border-box; border: 2px solid #000; margin: auto; }
  .sticker-header { text-align: center; font-size: 13px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px; }
  .sticker-header .brand { font-size: 15px; letter-spacing: 1px; }
  .section-label { font-size: 9px; font-weight: bold; text-transform: uppercase; color: #555; margin-top: 10px; border-bottom: 1px dashed #999; padding-bottom: 2px; margin-bottom: 4px; }
  .value { font-size: 12px; font-weight: 600; margin: 2px 0; }
  .value.big { font-size: 16px; }
  .order-id { font-size: 28px; font-weight: 900; text-align: center; margin: 12px 0 4px; letter-spacing: 2px; }
  .pay-badge { text-align: center; padding: 8px 0; border: 3px solid #000; border-radius: 6px; font-size: 18px; font-weight: 900; margin: 10px 0; background: ${payMethod === 'PREPAID (UPI)' ? '#d4edda' : '#fff3cd'}; }
  .footer { font-size: 9px; text-align: center; color: #555; margin-top: 14px; border-top: 1px dashed #999; padding-top: 6px; }
  .items-list { font-size: 10px; margin: 4px 0; }
</style>
</head>
<body>
  <div class="sticker-header">
    <div class="brand">${shopName}</div>
    <div style="font-size:10px;">${shopAddr}</div>
    <div style="font-size:10px;">Ph: ${shopPhone}</div>
  </div>

  <div class="section-label">From (Sender)</div>
  <div class="value">${shopName}</div>
  <div class="value">${shopAddr}</div>
  <div class="value">Ph: ${shopPhone}</div>

  <div class="section-label">To (Recipient)</div>
  <div class="value big">${order.customer_name || '-'}</div>
  <div class="value">${order.customer_address || '-'}</div>
  <div class="value">Ph: ${order.customer_phone || '-'}</div>

  <div class="order-id">ORDER #${order.id}</div>

  <div class="pay-badge">${payMethod}</div>

  <div class="section-label">Items</div>
  <div class="items-list">${(order.items_parsed || []).map(i => `${i.name} x${i.quantity} = ${i.total}`).join('<br>') || order.items || '-'}</div>

  <div class="section-label">Order Total</div>
  <div class="value big" style="text-align:center; font-size:22px; font-weight:900;">${order.total || '-'}</div>

  <div class="footer">
    ${new Date().toLocaleString('en-IN')} | Jainzee Food Processing Industries<br>
    Handle with care. Subject to Indore jurisdiction.
  </div>
</body>
</html>`;
            const win = window.open('', '_blank', 'width=500,height=700');
            win.document.write(html);
            win.document.close();
            win.focus();
            setTimeout(() => win.print(), 500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            // The polling is handled by admin.js (loaded above) - it also updates the badge
        });
    </script>
</body>
</html>
